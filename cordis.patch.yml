# dsh-paste-to-path: keep short text native; turn long text and files into managed path attachments.
- insert:
    - id: paste-to-path
      name: dsh-paste-to-path
      config:
        # Off by default: let DSH 0.1.5+ own ordinary images and files.
        # Turn this on only to restore the complete classic P2P attachment path.
        takeOverNativeAttachments: false
        # Legacy P2P implementation details used only while takeover is enabled.
        capturePaste: true
        captureDrop: true
        showPicker: true
        showDock: true
        # Independent of takeover. Long text follows the selected attachment owner.
        longTextAsAttachment: true
        longTextThreshold: 8000
        # Convert pasted absolute paths into managed references when they exist on the DSH Host.
        pathTextAsAttachment: true
        # On a direct localhost Windows session, recover Explorer's FileDropList when Chromium hides file bytes.
        windowsClipboardFallback: true
        # Store up to 25 MiB per file; edit up to 1 MiB of text inside the dock card.
        maxBytes: 26214400
        editableTextMaxBytes: 1048576
